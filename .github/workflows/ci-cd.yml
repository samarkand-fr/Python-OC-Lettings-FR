name: CI/CD Pipeline

on:
  push:
  pull_request:
    branches: [ master, main ]

env:
  SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-temporary-secret-key-for-tests' }}

jobs:
  # Job 1: Compilation, Linting, Tests & Coverage Verification (> 80%)
  test_and_lint:
    name: Lint & Test Suite
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8 linter
        run: |
          flake8

      - name: Run test suite with Coverage
        run: |
          coverage run -m pytest

      - name: Verify test coverage is above 80%
        run: |
          coverage report --fail-under=80 --omit="*/tests*,*/migrations/*,manage.py,*/wsgi.py,*/asgi.py,conftest.py"

  # Job 2: Containerization & Push to Docker Hub (master branch only)
  build_and_push_docker:
    name: Build & Push Docker Image
    needs: test_and_lint
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/oc-lettings:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/oc-lettings:latest

  # Job 3: Automated Production Deployment (master branch only)
  deploy:
    name: Deploy to Production
    needs: build_and_push_docker
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Triggering deployment on Render..."
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployment hook successfully called."
